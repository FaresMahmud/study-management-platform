version: '3.8'

services:
  # Production Services
  db-prod:
    image: postgres:16-alpine
    container_name: study-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME:study_platform}
      POSTGRES_USER: ${DB_USERNAME:study_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:study_user} -d ${DB_NAME:study_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis-prod:
    image: redis:7-alpine
    container_name: study-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  chroma-prod:
    image: chromadb/chroma:0.4.24
    container_name: study-chroma-prod
    volumes:
      - chroma-prod-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  # Backend Production
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:update}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:10}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${HIKARI_MIN_IDLE:2}
      SPRING_DATA_REDIS_HOST: redis-prod
      SPRING_DATA_REDIS_PORT: 6379
      CHROMA_URL: http://chroma-prod:8000
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
    ports:
      - "8080:8080"
    depends_on:
      db-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
      chroma-prod:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped

  # Frontend Production
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: study-frontend-prod
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "80:80"
    depends_on:
      - backend-prod
    restart: unless-stopped

volumes:
  db-prod-data:
  redis-prod-data:
  chroma-prod-data: