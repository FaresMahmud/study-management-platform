spring.application.name=study-management-platform

# Perfil ativo padrão (dev caso SPRING_PROFILES_ACTIVE não seja informado)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Servidor
server.port=${SERVER_PORT:8080}

# JWT (OBRIGATÓRIO em produção - não deve ter fallback padrão)
jwt.secret=${JWT_SECRET:dev-secret-change-in-production-min-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Jackson (datas como string ISO, ex: "2025-01-15")
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=false

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}

# ChromaDB Vector Store
# Suporta CHROMA_URL direto OU construção a partir de CHROMADB_HOST/CHROMADB_PORT (Docker Compose)
chroma.url=${CHROMA_URL:http://${CHROMADB_HOST:localhost}:${CHROMADB_PORT:8000}}

# Upload de arquivos (PDFs)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always

# OAuth2 Client Configurations
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-mock-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-mock-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:github-mock-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:github-mock-secret}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
