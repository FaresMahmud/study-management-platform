# Perfil de Produção (prod) — PostgreSQL no Neon Database

# Datasource PostgreSQL — variáveis SPRING_DATASOURCE_* têm prioridade (Neon)
# DATABASE_URL ou SPRING_DATASOURCE_URL: JDBC URL do Neon (jdbc:postgresql://...?sslmode=require)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/study_platform}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Pool de conexões HikariCP otimizado para Neon / Cloud SSL
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000

# Redis (opcional) — CacheConfig faz fallback para in-memory se indisponível
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000

# Health check: ignorar Redis no status geral
management.health.redis.enabled=false

# Logging
logging.level.com.studyplatform=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
