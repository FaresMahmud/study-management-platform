# Perfil de Desenvolvimento (dev)

# Banco de dados MySQL (Desenvolvimento Local)
# Defina DB_URL, DB_USERNAME e DB_PASSWORD no arquivo .env (nunca hardcode de credenciais aqui)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studyplatform?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# Logging
logging.level.com.studyplatform=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
