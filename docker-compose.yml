version: '3.8'

services:
  # Development Services
  db-dev:
    image: mysql:8.0
    container_name: study-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: study_platform
      MYSQL_USER: study_user
      MYSQL_PASSWORD: study_pass
    ports:
      - "3306:3306"
    volumes:
      - db-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:7-alpine
    container_name: study-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma-dev:
    image: chromadb/chroma:0.4.24
    container_name: study-chroma-dev
    ports:
      - "8000:8000"
    volumes:
      - chroma-dev-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Development
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://db-dev:3306/study_platform?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: study_user
      SPRING_DATASOURCE_PASSWORD: study_pass
      SPRING_DATA_REDIS_HOST: redis-dev
      SPRING_DATA_REDIS_PORT: 6379
      CHROMADB_HOST: chroma-dev
      CHROMADB_PORT: 8000
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    ports:
      - "8080:8080"
    depends_on:
      db-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      chroma-dev:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2

  # Frontend Development
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: study-frontend-dev
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend-dev

volumes:
  db-dev-data:
  redis-dev-data:
  chroma-dev-data: